server {
    listen 80;
    server_name 47.100.74.187;
    root /var/www/ielts-studio/current;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/ielts-studio.access.log;
    error_log /var/log/nginx/ielts-studio.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.mp3$ {
        try_files $uri =404;
        expires 30d;
    }
}
